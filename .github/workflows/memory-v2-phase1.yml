name: Memory V2 Phase 1 Sidecar

on:
  push:
    branches:
      - agent/memory-v2-phase1-20260820
      - agent/memory-v2-history-source-descriptors-20260821
    paths:
      - "bridge/memory-v2/**"
      - "supabase/migrations/20260820110600_create_memory_v2_phase1.sql"
      - "supabase/rollback/20260820110600_create_memory_v2_phase1_rollback.sql"
      - "supabase/tests/memory_v2_phase1.sql"
      - "supabase/migrations/20260820163417_memory_v2_history_source_descriptors.sql"
      - "supabase/rollback/20260820163417_memory_v2_history_source_descriptors_rollback.sql"
      - "supabase/tests/memory_v2_history_source_descriptors.sql"
      - ".github/workflows/memory-v2-phase1.yml"
  pull_request:
    paths:
      - "bridge/memory-v2/**"
      - "supabase/migrations/20260820110600_create_memory_v2_phase1.sql"
      - "supabase/rollback/20260820110600_create_memory_v2_phase1_rollback.sql"
      - "supabase/tests/memory_v2_phase1.sql"
      - "supabase/migrations/20260820163417_memory_v2_history_source_descriptors.sql"
      - "supabase/rollback/20260820163417_memory_v2_history_source_descriptors_rollback.sql"
      - "supabase/tests/memory_v2_history_source_descriptors.sql"
      - ".github/workflows/memory-v2-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.113.0

      - name: Start fresh disposable Supabase
        run: |
          mkdir -p .memory-v2-ci
          supabase init --workdir .memory-v2-ci --yes
          supabase start --workdir .memory-v2-ci \
            --exclude studio,imgproxy,storage-api,realtime,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Fresh apply and behavior tests
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260820110600_create_memory_v2_phase1.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260820163417_memory_v2_history_source_descriptors.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_v2_phase1.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_v2_history_source_descriptors.sql
          supabase db lint --workdir .memory-v2-ci --local --schema public --level warning --fail-on error

      - name: Rollback and re-apply
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/rollback/20260820163417_memory_v2_history_source_descriptors_rollback.sql
          test "$(psql "$DB" -Atc "select position('''sources''' in pg_get_functiondef('public.memory_v2_history(uuid,text,uuid)'::regprocedure)) = 0;")" = "t"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260820163417_memory_v2_history_source_descriptors.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_v2_history_source_descriptors.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/rollback/20260820110600_create_memory_v2_phase1_rollback.sql
          test "$(psql "$DB" -Atc "select count(*) from pg_class where relnamespace='public'::regnamespace and relname like 'memory_v2_%';")" = "0"
          test "$(psql "$DB" -Atc "select count(*) from pg_proc where pronamespace='public'::regnamespace and proname like 'memory_v2_%';")" = "0"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260820110600_create_memory_v2_phase1.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260820163417_memory_v2_history_source_descriptors.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_v2_phase1.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_v2_history_source_descriptors.sql

      - name: Bridge full regression
        working-directory: bridge
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test

      - name: Frontend regression
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --workdir .memory-v2-ci --no-backup
