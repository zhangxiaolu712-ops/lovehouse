name: Memory Source Evidence Delta

on:
  pull_request:
    paths:
      - "bridge/**"
      - "supabase/migrations/**"
      - "supabase/rollback/**"
      - "supabase/tests/**"
      - ".github/workflows/memory-source-evidence-delta.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-supabase-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.113.0

      - name: Start fresh disposable Supabase
        run: |
          mkdir -p .memory-source-ci
          supabase init --workdir .memory-source-ci --yes
          supabase start --workdir .memory-source-ci \
            --exclude studio,imgproxy,storage-api,realtime,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Apply all canonical Memory migrations and tests
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260808191311_create_unified_memory_system_v2.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_system_phase2.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260808215808_memory_runtime_phase3.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_runtime_phase3.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260808230911_memory_behavior_phase4a.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_behavior_phase4a.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260809004549_memory_behavior_phase4b_dream_foundation.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_behavior_phase4b.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260809024511_ai_startup_memory_box_v1.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/ai_startup_memory_box_v1.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813043742_memory_source_evidence_delta.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_source_evidence_delta.sql
          supabase db lint --workdir .memory-source-ci --local --schema public --level warning --fail-on error

      - name: Roll back delta and prove the 9fe contract is restored
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/rollback/20260813043742_memory_source_evidence_delta_rollback.sql
          test "$(psql "$DB" -Atc "select count(*) from pg_class where relnamespace='public'::regnamespace and relname in ('memory_sources','memory_revision_sources');")" = "0"
          test "$(psql "$DB" -Atc "select count(*) from pg_attribute where attrelid='public.memory_entries'::regclass and attname='summary' and not attisdropped;")" = "0"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_runtime_phase3.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_behavior_phase4a.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_behavior_phase4b.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/ai_startup_memory_box_v1.sql

      - name: Re-apply delta and rerun source evidence tests
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813043742_memory_source_evidence_delta.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/memory_source_evidence_delta.sql

      - name: Bridge full regression
        working-directory: bridge
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test

      - name: Frontend lint and build regression
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --workdir .memory-source-ci --no-backup
